<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#061923"><link rel="icon" href="assets/wave-icon.svg" type="image/svg+xml"><title>Pausa Guiada — Low</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#041820;color:#f4f0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.scene,canvas{position:absolute;inset:0;width:100%;height:100%}.scene{background:radial-gradient(ellipse at 50% 32%,#276b70,#061923 72%)}.top{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:3px;padding:5px;border:1px solid #ffffff25;border-radius:18px;background:#041920b8}.top button{flex:1;min-width:0;border:0;border-radius:12px;padding:8px 2px;color:#dbe5de;background:transparent;font-size:11px;font-weight:760;white-space:nowrap}.top button[aria-pressed=true]{background:#83b5aa42;color:#fffbed}.profiles{position:fixed;z-index:4;top:68px;left:14px;display:flex;gap:2px;padding:2px;border:1px solid #ffffff25;border-radius:999px;background:#041920b8}.profiles a{min-width:38px;padding:5px 7px;border-radius:999px;color:#c9d5cf;font-size:9px;font-weight:800;letter-spacing:.06em;text-align:center;text-decoration:none}.profiles a[aria-current=page]{background:#83b5aa42;color:#fffbed}.content{position:fixed;z-index:2;inset:100px 22px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}h1{min-height:2.16em;margin:0;font-size:clamp(29px,8vw,46px);font-weight:750;letter-spacing:.045em;line-height:1.08;text-transform:uppercase;text-shadow:0 2px 20px #000}.hint{height:34px;margin:4px 0 0;color:#fffef8;font-size:12px;-webkit-text-stroke:.6px #000b}.space{flex:1}.timer{margin:0;font-size:clamp(64px,19vw,112px);font-weight:600;letter-spacing:-.07em;line-height:.9;-webkit-text-stroke:1.5px #000a}.bar{width:clamp(210px,48vw,310px);height:4px;margin-top:14px}.bar i{display:block;width:100%;height:100%;border-radius:99px;background:#ffffff0d}.prompt{height:34px;margin:22px 0 0;font-size:12px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;-webkit-text-stroke:.55px #000b}.note{position:fixed;z-index:4;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);margin:0;padding:8px 12px;border:1px solid #ffffff22;border-radius:999px;background:#041920a8;color:#d3e0d8;font-size:10px;white-space:nowrap}.gate{position:fixed;z-index:9;inset:0;display:grid;place-items:center;padding:28px;background:#071d26}.gate[hidden]{display:none}.gate form{display:grid;gap:10px;width:min(100%,320px)}.gate input,.gate button{min-height:50px;border-radius:14px;border:1px solid #ffffff35;padding:0 14px;font:inherit;text-align:center}.gate input{background:#02151d;color:#fff}.gate button{background:#e9dfbd;color:#092a33;font-weight:750}
</style></head><body><div id="app"><div class="scene" id="scene"></div><canvas id="canvas"></canvas><nav class="top"><button data-mode="sea" aria-pressed="true">Mar</button><button data-mode="waves">Ondas</button><button data-mode="drift">Sobrevoo</button><button data-mode="ink">Tinta</button><button data-mode="depths">Profundezas</button><button data-mode="grass">Grama</button></nav><nav class="profiles"><a href="index.html">High</a><a href="mid.html">Mid</a><a href="low.html" aria-current="page">Low</a></nav><section class="content"><h1 id="title">MAR CALMO</h1><p class="hint" id="hint">Toque para criar uma ondulação</p><div class="space"></div><p class="timer" id="timer">10:00</p><div class="bar"><i id="bar"></i></div><p class="prompt">RECONHEÇA: “ISSO É UMA VONTADE.”</p><div class="space"></div></section><p class="note">LOW · Canvas 2D a 15 fps · toque para interagir</p></div><section class="gate" id="gate" hidden><form id="form"><strong>PAUSA GUIADA</strong><input id="password" type="password" placeholder="Palavra de acesso" required><button>Continuar</button></form></section><script>
(()=>{const gate=document.querySelector('#gate'),key='guided-relief-access';try{if(localStorage.getItem(key)!=='granted')gate.hidden=false}catch{gate.hidden=false}document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(password.value==='sph'){try{localStorage.setItem(key,'granted')}catch{}gate.hidden=true}};const c=canvas,x=c.getContext('2d'),scene=document.querySelector('#scene'),title=document.querySelector('#title'),hint=document.querySelector('#hint'),labels={sea:['MAR CALMO','Toque para criar uma ondulação'],waves:['ONDAS','Toque para uma onda'],drift:['SOBREVOO','Toque para mudar a rota'],ink:['TINTA NA ÁGUA','Toque para soltar tinta'],depths:['PROFUNDEZAS','Toque para abrir a água'],grass:['SENTIR A GRAMA','Passe o dedo pela grama']};let mode='sea',last=0,elapsed=0,dots=[];function fit(){let w=innerWidth,h=innerHeight;if(c.width!==w||c.height!==h){c.width=w;c.height=h}}fit();addEventListener('resize',fit);function hit(e){let r=c.getBoundingClientRect();dots.push({x:e.clientX-r.left,y:e.clientY-r.top,a:0});if(dots.length>32)dots.shift()}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);hit(e)};c.onpointermove=e=>{if(e.buttons)hit(e)};function frame(t){if(t-last<66){requestAnimationFrame(frame);return}last=t;fit();let w=c.width,h=c.height;x.clearRect(0,0,w,h);let palettes={sea:['#1d6870','#061923'],waves:['#235c69','#071a25'],drift:['#487f7b','#0b2930'],ink:['#154c55','#071824'],depths:['#47766f','#0b252d'],grass:['#709b88','#17362a']}[mode],g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,palettes[0]);g.addColorStop(1,palettes[1]);x.fillStyle=g;x.fillRect(0,0,w,h);if(mode==='grass'){for(let i=0;i<62;i++){let px=i*23%w,len=65+(i%5)*18;x.strokeStyle=`rgba(48,${95+i%50},55,.8)`;x.lineWidth=2;x.beginPath();x.moveTo(px,h);x.quadraticCurveTo(px+Math.sin(t*.001+i)*10,h-len*.5,px+Math.sin(t*.001+i)*16,h-len);x.stroke()}}else if(mode==='drift'){for(let i=0;i<5;i++){let px=((i*.23+t*.00001)%1)*w,py=(.28+i*.14)*h;x.fillStyle='#52684c';x.beginPath();x.ellipse(px,py,w*.11,w*.06,.3,0,7);x.fill()}}else if(mode==='depths'){for(let i=0;i<12;i++){x.fillStyle='#d8b859';x.beginPath();x.ellipse((i*.17%1)*w,(.2+(i*.27% .65))*h,w*.02,w*.007,0,0,7);x.fill()}x.fillStyle='#031820e8';x.fillRect(0,0,w,h);x.globalCompositeOperation='destination-out'}for(let d of dots){d.a+=.026;let r=(mode==='ink'?20+d.a*110:12+d.a*90),a=Math.max(0,.5-d.a);if(mode==='ink'){let q=x.createRadialGradient(d.x,d.y,0,d.x,d.y,r);q.addColorStop(0,`rgba(102,217,179,${a})`);q.addColorStop(1,'transparent');x.fillStyle=q;x.fillRect(d.x-r,d.y-r,r*2,r*2)}else{x.strokeStyle=`rgba(240,247,230,${a})`;x.lineWidth=2;x.beginPath();x.ellipse(d.x,d.y,r,r*.34,0,0,7);x.stroke()}}x.globalCompositeOperation='source-over';dots=dots.filter(d=>d.a<.55);requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(z=>z.setAttribute('aria-pressed',z===b));title.textContent=labels[mode][0];hint.textContent=labels[mode][1];dots=[]});setInterval(()=>{elapsed=Math.min(600,elapsed+1);let left=600-elapsed;timer.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;bar.style.width=`${left/6}%`},1000)})();
</script></body></html>
