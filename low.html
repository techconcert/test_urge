<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="icon" href="assets/wave-icon.svg"><title>Pausa Guiada — Low</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#041820;color:#f4f0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:3px;padding:5px;border:1px solid #ffffff25;border-radius:18px;background:#041920b8}.top button{flex:1;min-width:0;border:0;border-radius:12px;padding:8px 2px;color:#dbe5de;background:transparent;font-size:11px;font-weight:760;white-space:nowrap}.top button[aria-pressed=true],.profiles a[aria-current=page]{background:#83b5aa42;color:#fffbed}.profiles{position:fixed;z-index:4;top:68px;left:14px;display:flex;gap:2px;padding:2px;border:1px solid #ffffff25;border-radius:999px;background:#041920b8}.profiles a{min-width:38px;padding:5px 7px;border-radius:999px;color:#c9d5cf;font-size:9px;font-weight:800;text-align:center;text-decoration:none}.content{position:fixed;z-index:2;inset:100px 22px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}h1{min-height:2.16em;margin:0;font-size:clamp(29px,8vw,46px);font-weight:750;letter-spacing:.045em;line-height:1.08;text-transform:uppercase;text-shadow:0 2px 20px #000}.hint{height:34px;margin:4px 0 0;color:#fffef8;font-size:12px;-webkit-text-stroke:.6px #000b}.space{flex:1}.timer{margin:0;font-size:clamp(64px,19vw,112px);font-weight:600;letter-spacing:-.07em;line-height:.9;-webkit-text-stroke:1.5px #000a}.bar{width:clamp(210px,48vw,310px);height:4px;margin-top:14px}.bar i{display:block;width:100%;height:100%;border-radius:99px;background:#ffffff0d}.prompt{height:34px;margin:22px 0 0;font-size:12px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;-webkit-text-stroke:.55px #000b}.note{position:fixed;z-index:4;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);margin:0;padding:8px 12px;border:1px solid #ffffff22;border-radius:999px;background:#041920a8;color:#d3e0d8;font-size:10px;white-space:nowrap}.gate{position:fixed;z-index:9;inset:0;display:grid;place-items:center;padding:28px;background:#071d26}.gate[hidden]{display:none}.gate form{display:grid;gap:10px;width:min(100%,320px)}.gate input,.gate button{min-height:50px;border-radius:14px;border:1px solid #ffffff35;padding:0 14px;font:inherit;text-align:center}.gate input{background:#02151d;color:#fff}.gate button{background:#e9dfbd;color:#092a33;font-weight:750}
</style></head><body><div id="app"><canvas id="canvas"></canvas><nav class="top"><button data-mode="sea" aria-pressed="true">Mar</button><button data-mode="waves">Ondas</button><button data-mode="drift">Sobrevoo</button><button data-mode="ink">Tinta</button><button data-mode="depths">Profundezas</button><button data-mode="grass">Grama</button></nav><nav class="profiles"><a href="index.html">High</a><a href="mid.html">Mid</a><a href="low.html" aria-current="page">Low</a></nav><section class="content"><h1 id="title">MAR CALMO</h1><p class="hint" id="hint">Toque para criar uma ondulação</p><div class="space"></div><p class="timer" id="timer">10:00</p><div class="bar"><i id="bar"></i></div><p class="prompt">RECONHEÇA: “ISSO É UMA VONTADE.”</p><div class="space"></div></section><p class="note">LOW · composição essencial · 15 fps</p></div><section class="gate" id="gate" hidden><form id="form"><strong>PAUSA GUIADA</strong><input id="password" type="password" placeholder="Palavra de acesso" required><button>Continuar</button></form></section><script>
(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#canvas'),x=c.getContext('2d',{alpha:false}),title=$('#title'),hint=$('#hint'),timer=$('#timer'),bar=$('#bar'),L={sea:['MAR CALMO','Toque para criar uma ondulação'],waves:['ONDAS','Toque para criar uma onda'],drift:['SOBREVOO','Deslize por águas e cardumes'],ink:['TINTA NA ÁGUA','Toque e arraste para soltar tinta'],depths:['PROFUNDEZAS','Deslize para abrir a água escura'],grass:['SENTIR A GRAMA','Passe o dedo pela grama']};let mode='sea',last=0,elapsed=0,marks=[],drops=[],fish=Array.from({length:18},()=>({x:Math.random(),y:Math.random(),a:Math.random()*7}));const gate=$('#gate');try{if(localStorage.getItem('guided-relief-access')!=='granted')gate.hidden=false}catch{gate.hidden=false}$('#form').onsubmit=e=>{e.preventDefault();if($('#password').value==='sph'){try{localStorage.setItem('guided-relief-access','granted')}catch{}gate.hidden=true}};function fit(){if(c.width!==innerWidth||c.height!==innerHeight){c.width=innerWidth;c.height=innerHeight}}function hit(e){let r=c.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,a:0};marks.push(p);if(mode==='ink')for(let i=0;i<14;i++)drops.push({...p,a:0,h:155+Math.random()*60,z:Math.random()*7})}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);hit(e)};c.onpointermove=e=>{if(e.buttons)hit(e)};function water(w,h,t){let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#0e4e5b');g.addColorStop(1,'#041923');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<12;i++){let y=i*h/11,o=Math.sin(t*.0003+i)*12;x.strokeStyle=`rgba(150,219,205,${.035+(i%2)*.016})`;x.lineWidth=6;x.beginPath();x.moveTo(0,y);x.quadraticCurveTo(w*.5,y+o,w,y-o);x.stroke()}[[.18,.29,.2],[.74,.23,.17],[.5,.63,.23],[.1,.84,.16],[.85,.78,.19]].forEach(a=>{let q=x.createRadialGradient(a[0]*w,a[1]*h,0,a[0]*w,a[1]*h,a[2]*w);q.addColorStop(0,'rgba(65,73,59,.9)');q.addColorStop(1,'rgba(7,30,34,0)');x.fillStyle=q;x.fillRect((a[0]-a[2])*w,(a[1]-a[2])*h,a[2]*w*2,a[2]*w*2)})}function draw(t){requestAnimationFrame(draw);if(document.hidden||t-last<66)return;last=t;fit();let w=c.width,h=c.height;if(mode==='sea'||mode==='waves'||mode==='drift'){water(w,h,t);if(mode==='drift')for(let i=0;i<5;i++){x.fillStyle='rgba(222,230,203,.55)';x.beginPath();x.ellipse(((i*.24+t*.000012)%1)*w,(.22+i*.14)*h,w*.008,w*.003,0,0,7);x.fill()}}else if(mode==='ink'){x.fillStyle='#082934';x.fillRect(0,0,w,h);x.globalCompositeOperation='screen';for(let d of drops){d.a+=.012;let rr=10+d.a*95,px=(d.x+Math.cos(d.z+d.a*4)*d.a*.1)*w,py=(d.y+Math.sin(d.z+d.a*4)*d.a*.1)*h,q=x.createRadialGradient(px,py,0,px,py,rr);q.addColorStop(0,`hsla(${d.h},65%,68%,${Math.max(0,.3-d.a*.18)})`);q.addColorStop(1,'transparent');x.fillStyle=q;x.fillRect(px-rr,py-rr,rr*2,rr*2)}x.globalCompositeOperation='source-over';drops=drops.filter(d=>d.a<1.3)}else if(mode==='depths'){x.fillStyle='#46736f';x.fillRect(0,0,w,h);for(let f of fish){f.x=(f.x+Math.cos(f.a)*.001+1)%1;x.fillStyle='#d5b55f';x.beginPath();x.ellipse(f.x*w,f.y*h,w*.016,w*.005,f.a,0,7);x.fill()}x.fillStyle='rgba(2,20,27,.91)';x.fillRect(0,0,w,h);x.globalCompositeOperation='destination-out'}else{let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#86aab1');g.addColorStop(.56,'#6e986a');g.addColorStop(.57,'#173c2d');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<90;i++){let p=i*29%w,l=90+i%7*10;x.strokeStyle=`hsl(${98+i%26} 34% ${23+i%20}%)`;x.beginPath();x.moveTo(p,h);x.quadraticCurveTo(p+Math.sin(t*.001+i)*8,h-l*.5,p+5,h-l);x.stroke()}}for(let m of marks){m.a+=.02;let r=10+m.a*75;if(mode==='depths'){let q=x.createRadialGradient(m.x*w,m.y*h,0,m.x*w,m.y*h,r);q.addColorStop(0,`rgba(0,0,0,${Math.max(0,.85-m.a*.08)})`);q.addColorStop(1,'transparent');x.fillStyle=q;x.fillRect(m.x*w-r,m.y*h-r,r*2,r*2)}else if(mode!=='ink'){x.strokeStyle=`rgba(243,245,226,${Math.max(0,.5-m.a)})`;x.beginPath();x.ellipse(m.x*w,m.y*h,r,r*.34,0,0,7);x.stroke()}}x.globalCompositeOperation='source-over';marks=marks.filter(m=>m.a<8)}requestAnimationFrame(draw);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(q=>q.setAttribute('aria-pressed',q===b));[title.textContent,hint.textContent]=L[mode];marks=[];drops=[]});setInterval(()=>{elapsed=Math.min(600,elapsed+1);let left=600-elapsed;timer.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;bar.style.width=`${left/6}%`},1000)})();
</script></body></html>
