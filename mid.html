<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="icon" href="assets/wave-icon.svg"><title>Pausa Guiada — Mid</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#041820;color:#f4f0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:3px;padding:5px;border:1px solid #ffffff25;border-radius:18px;background:#041920b8;backdrop-filter:blur(12px)}.top button{flex:1;min-width:0;border:0;border-radius:12px;padding:8px 2px;color:#dbe5de;background:transparent;font-size:11px;font-weight:760;white-space:nowrap}.top button[aria-pressed=true],.profiles a[aria-current=page]{background:#83b5aa42;color:#fffbed}.profiles{position:fixed;z-index:4;top:68px;left:14px;display:flex;gap:2px;padding:2px;border:1px solid #ffffff25;border-radius:999px;background:#041920b8}.profiles a{min-width:38px;padding:5px 7px;border-radius:999px;color:#c9d5cf;font-size:9px;font-weight:800;text-align:center;text-decoration:none}.content{position:fixed;z-index:2;inset:100px 22px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}h1{min-height:2.16em;margin:0;font-size:clamp(29px,8vw,46px);font-weight:750;letter-spacing:.045em;line-height:1.08;text-transform:uppercase;text-shadow:0 2px 20px #000}.hint{height:34px;margin:4px 0 0;color:#fffef8;font-size:12px;-webkit-text-stroke:.6px #000b}.space{flex:1}.timer{margin:0;font-size:clamp(64px,19vw,112px);font-weight:600;letter-spacing:-.07em;line-height:.9;-webkit-text-stroke:1.5px #000a}.bar{width:clamp(210px,48vw,310px);height:4px;margin-top:14px}.bar i{display:block;width:100%;height:100%;border-radius:99px;background:#ffffff0d}.prompt{height:34px;margin:22px 0 0;font-size:12px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;-webkit-text-stroke:.55px #000b}.note{position:fixed;z-index:4;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);margin:0;padding:8px 12px;border:1px solid #ffffff22;border-radius:999px;background:#041920a8;color:#d3e0d8;font-size:10px;white-space:nowrap}.gate{position:fixed;z-index:9;inset:0;display:grid;place-items:center;padding:28px;background:#071d26}.gate[hidden]{display:none}.gate form{display:grid;gap:10px;width:min(100%,320px)}.gate input,.gate button{min-height:50px;border-radius:14px;border:1px solid #ffffff35;padding:0 14px;font:inherit;text-align:center}.gate input{background:#02151d;color:#fff}.gate button{background:#e9dfbd;color:#092a33;font-weight:750}
</style></head><body><div id="app"><canvas id="canvas"></canvas><nav class="top"><button data-mode="sea" aria-pressed="true">Mar</button><button data-mode="waves">Ondas</button><button data-mode="drift">Sobrevoo</button><button data-mode="ink">Tinta</button><button data-mode="depths">Profundezas</button><button data-mode="grass">Grama</button></nav><nav class="profiles"><a href="index.html">High</a><a href="mid.html" aria-current="page">Mid</a><a href="low.html">Low</a></nav><section class="content"><h1 id="title">MAR CALMO</h1><p class="hint" id="hint">Toque e arraste para criar ondulações</p><div class="space"></div><p class="timer" id="timer">10:00</p><div class="bar"><i id="bar"></i></div><p class="prompt">RECONHEÇA: “ISSO É UMA VONTADE.”</p><div class="space"></div></section><p class="note">MID · materiais simplificados · 30 fps</p></div><section class="gate" id="gate" hidden><form id="form"><strong>PAUSA GUIADA</strong><input id="password" type="password" placeholder="Palavra de acesso" required><button>Continuar</button></form></section><script>
(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#canvas'),x=c.getContext('2d',{alpha:false}),title=$('#title'),hint=$('#hint'),bar=$('#bar'),timer=$('#timer'),L={sea:['MAR CALMO','Toque e arraste para criar ondulações'],waves:['ONDAS','Segure para formar uma onda maior'],drift:['SOBREVOO','Deslize por águas, pedras e cardumes'],ink:['TINTA NA ÁGUA','Toque e arraste para soltar tinta'],depths:['PROFUNDEZAS','Deslize para abrir a água escura'],grass:['SENTIR A GRAMA','Passe o dedo pela grama']};let mode='sea',last=0,elapsed=0,down=false,marks=[],plumes=[],fish=Array.from({length:28},()=>({x:Math.random(),y:Math.random(),a:Math.random()*7,s:.00012+Math.random()*.00016,h:35+Math.random()*25}));const gate=$('#gate');try{if(localStorage.getItem('guided-relief-access')!=='granted')gate.hidden=false}catch{gate.hidden=false}$('#form').onsubmit=e=>{e.preventDefault();if($('#password').value==='sph'){try{localStorage.setItem('guided-relief-access','granted')}catch{}gate.hidden=true}};function fit(){let d=Math.min(devicePixelRatio||1,1.2),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}}function add(e){let r=c.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,a:0};marks.push(p);if(marks.length>120)marks.shift();if(mode==='ink')for(let i=0;i<34;i++){let z=Math.random()*7,v=.00035+Math.random()*.001;plumes.push({x:p.x,y:p.y,vx:Math.cos(z)*v,vy:Math.sin(z)*v,a:0,h:150+Math.random()*65})}}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);add(e)};c.onpointermove=e=>{if(down)add(e)};c.onpointerup=()=>down=false;function water(w,h,t,drift){let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#0b3f4d');g.addColorStop(.5,'#07303b');g.addColorStop(1,'#031820');x.fillStyle=g;x.fillRect(0,0,w,h);for(let j=0;j<30;j++){let y=j*h/28,a=10+9*Math.sin(j*2.1);x.beginPath();for(let i=0;i<17;i++){let px=i*w/16,py=y+Math.sin(i*.9+j*1.7+t*.00022)*a+Math.sin(i*.22-t*.00014)*a*.7;i?x.lineTo(px,py):x.moveTo(px,py)}x.strokeStyle=`rgba(114,209,199,${.025+(j%5)*.009})`;x.lineWidth=3+(j%4)*3;x.stroke()}let d=drift?t*.000018:0;[[.17,.28,.21],[.72,.2,.18],[.47,.57,.27],[.1,.83,.2],[.84,.8,.24]].forEach((a,i)=>{let px=(a[0]*w-d*(.35+i*.1)+w)%w,py=a[1]*h,r=a[2]*w,q=x.createRadialGradient(px,py,r*.08,px,py,r);q.addColorStop(0,'rgba(83,84,68,.96)');q.addColorStop(.62,'rgba(39,54,50,.96)');q.addColorStop(1,'rgba(6,28,32,0)');x.fillStyle=q;x.beginPath();x.ellipse(px,py,r,r*.72,.55,0,7);x.fill()});for(let i=0;i<26;i++){let y=(i*.09*h+t*.008+i*47)%h,o=Math.sin(i*3.1+t*.0005)*w*.04;x.strokeStyle=`rgba(225,239,220,${.035+(i%3)*.015})`;x.lineWidth=1+i%4;x.beginPath();x.moveTo(-30,y);x.bezierCurveTo(w*.25,y+o,w*.62,y-o,w+20,y+o*.2);x.stroke()}if(drift)for(let i=0;i<6;i++){x.fillStyle='rgba(205,224,188,.65)';x.beginPath();x.ellipse(((i*.21+t*.000015)%1)*w,(.22+(i*.171%.6))*h,w*.009,w*.0035,.2,0,7);x.fill()}}function ink(w,h){let g=x.createRadialGradient(w*.5,h*.4,0,w*.5,h*.5,w*.85);g.addColorStop(0,'#164a4d');g.addColorStop(1,'#041921');x.fillStyle=g;x.fillRect(0,0,w,h);x.globalCompositeOperation='screen';for(let p of plumes){let dx=p.x-.5,dy=p.y-.48,r=Math.hypot(dx,dy)+.05,s=.00028/r;p.vx+=-dy*s;p.vy+=dx*s;p.vx*=.988;p.vy*=.988;p.x+=p.vx*16;p.y+=p.vy*16;p.a+=.006;let rr=w*(.012+p.a*.16),q=x.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,rr),z=Math.max(0,.16-p.a*.11);q.addColorStop(0,`hsla(${p.h},62%,68%,${z})`);q.addColorStop(.45,`hsla(${p.h+22},55%,53%,${z*.5})`);q.addColorStop(1,'transparent');x.fillStyle=q;x.fillRect(p.x*w-rr,p.y*h-rr,rr*2,rr*2)}x.globalCompositeOperation='source-over';plumes=plumes.filter(p=>p.a<1.3&&p.x>-.2&&p.x<1.2&&p.y>-.2&&p.y<1.2)}function depths(w,h,t){let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#4e827a');g.addColorStop(1,'#153440');x.fillStyle=g;x.fillRect(0,0,w,h);for(let f of fish){f.a+=Math.sin(t*.0003+f.x*9)*.006;f.x=(f.x+Math.cos(f.a)*f.s*16+1)%1;f.y=(f.y+Math.sin(f.a)*f.s*11+1)%1;x.save();x.translate(f.x*w,f.y*h);x.rotate(f.a);x.fillStyle=`hsl(${f.h},50%,62%)`;x.beginPath();x.ellipse(0,0,w*.018,w*.006,0,0,7);x.fill();x.restore()}x.fillStyle='rgba(2,20,27,.91)';x.fillRect(0,0,w,h);x.globalCompositeOperation='destination-out';for(let m of marks){m.a+=.005;let r=w*.045,q=x.createRadialGradient(m.x*w,m.y*h,0,m.x*w,m.y*h,r);q.addColorStop(0,`rgba(0,0,0,${Math.max(0,.9-m.a*.08)})`);q.addColorStop(1,'transparent');x.fillStyle=q;x.fillRect(m.x*w-r,m.y*h-r,r*2,r*2)}x.globalCompositeOperation='source-over'}function grass(w,h,t){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#8aaeb4');g.addColorStop(.55,'#6d9668');g.addColorStop(.56,'#31533c');g.addColorStop(1,'#102b23');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<190;i++){let px=i*37%w,l=h*(.11+(i%11)*.012),b=Math.sin(t*.00065+i*.72)*8;x.strokeStyle=`hsl(${94+i%34} 36% ${20+i%24}%)`;x.lineWidth=1.4+i%3;x.beginPath();x.moveTo(px,h);x.quadraticCurveTo(px+b,h-l*.45,px+b*1.4,h-l);x.stroke()}}function draw(t){requestAnimationFrame(draw);if(document.hidden||t-last<33)return;last=t;fit();let w=c.width,h=c.height;if(mode==='sea'||mode==='waves'||mode==='drift'){water(w,h,t,mode==='drift');for(let m of marks){m.a+=.012;let r=m.a*w*.25;x.strokeStyle=`rgba(245,246,222,${Math.max(0,.42-m.a*.32)})`;x.lineWidth=1.5;x.beginPath();x.ellipse(m.x*w,m.y*h,r,r*.34,0,0,7);x.stroke()}}else if(mode==='ink')ink(w,h);else if(mode==='depths')depths(w,h,t);else grass(w,h,t);marks=marks.filter(m=>m.a<10)}requestAnimationFrame(draw);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(v=>v.setAttribute('aria-pressed',v===b));[title.textContent,hint.textContent]=L[mode];marks=[];plumes=[]});setInterval(()=>{elapsed=Math.min(600,elapsed+1);let left=600-elapsed;timer.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;bar.style.width=`${left/6}%`},1000)})();
</script></body></html>
