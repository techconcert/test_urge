:root{color-scheme:dark}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#041820;color:#f4f0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage,canvas{position:absolute;inset:0;width:100%;height:100%}.top{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:3px;padding:5px;border:1px solid #ffffff25;border-radius:18px;background:#041920b8;backdrop-filter:blur(12px)}.top button{flex:1;min-width:0;border:0;border-radius:12px;padding:8px 2px;color:#dbe5de;background:transparent;font-size:11px;font-weight:760;white-space:nowrap}.top button[aria-pressed=true]{background:#83b5aa42;color:#fffbed}.profiles{position:fixed;z-index:4;top:68px;left:14px;display:flex;gap:2px;padding:2px;border:1px solid #ffffff25;border-radius:999px;background:#041920b8}.profiles a{min-width:38px;padding:5px 7px;border-radius:999px;color:#c9d5cf;font-size:9px;font-weight:800;letter-spacing:.06em;text-align:center;text-decoration:none}.profiles a[aria-current=page]{background:#83b5aa42;color:#fffbed}.content{position:fixed;z-index:2;inset:100px 22px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}h1{min-height:2.16em;margin:0;font-size:clamp(29px,8vw,46px);font-weight:750;letter-spacing:.045em;line-height:1.08;text-transform:uppercase;text-shadow:0 2px 20px #000}.hint{height:34px;margin:4px 0 0;color:#fffef8;font-size:12px;-webkit-text-stroke:.6px #000b}.space{flex:1}.timer{margin:0;font-size:clamp(64px,19vw,112px);font-weight:600;letter-spacing:-.07em;line-height:.9;-webkit-text-stroke:1.5px #000a}.bar{width:clamp(210px,48vw,310px);height:4px;margin-top:14px}.bar i{display:block;width:100%;height:100%;border-radius:99px;background:#ffffff0d}.prompt{height:34px;margin:22px 0 0;font-size:12px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;-webkit-text-stroke:.55px #000b}.note{position:fixed;z-index:4;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);margin:0;padding:8px 12px;border:1px solid #ffffff22;border-radius:999px;background:#041920a8;color:#d3e0d8;font-size:10px;white-space:nowrap}.gate{position:fixed;z-index:9;inset:0;display:grid;place-items:center;padding:28px;background:#071d26}.gate[hidden]{display:none}.gate form{display:grid;gap:10px;width:min(100%,320px)}.gate input,.gate button{min-height:50px;border-radius:14px;border:1px solid #ffffff35;padding:0 14px;font:inherit;text-align:center}.gate input{background:#02151d;color:#fff}.gate button{background:#e9dfbd;color:#092a33;font-weight:750}
</style></head><body><div id="app"><canvas id="canvas"></canvas><nav class="top" id="modes"><button data-mode="sea" aria-pressed="true">Mar</button><button data-mode="waves">Ondas</button><button data-mode="drift">Sobrevoo</button><button data-mode="ink">Tinta</button><button data-mode="depths">Profundezas</button><button data-mode="grass">Grama</button></nav><nav class="profiles" aria-label="Perfil de renderização"><a href="index.html">High</a><a href="mid.html" aria-current="page">Mid</a><a href="low.html">Low</a></nav><section class="content"><h1 id="title">MAR CALMO</h1><p class="hint" id="hint">Toque e arraste para criar ondulações</p><div class="space"></div><p class="timer" id="timer">10:00</p><div class="bar"><i id="bar"></i></div><p class="prompt">RECONHEÇA: “ISSO É UMA VONTADE.”</p><div class="space"></div></section><p class="note">MID · Canvas 2D a 30 fps · toque para interagir</p></div><section class="gate" id="gate" hidden><form id="form"><strong>PAUSA GUIADA</strong><input id="password" type="password" placeholder="Palavra de acesso" required><button>Continuar</button></form></section><script>
(()=>{const gate=document.querySelector('#gate'),key='guided-relief-access';try{if(localStorage.getItem(key)!=='granted')gate.hidden=false}catch{gate.hidden=false}document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(password.value==='sph'){try{localStorage.setItem(key,'granted')}catch{}gate.hidden=true}};const c=canvas,ctx=c.getContext('2d'),title=document.querySelector('#title'),hint=document.querySelector('#hint'),labels={sea:['MAR CALMO','Toque e arraste para criar ondulações'],waves:['ONDAS','Segure para formar uma onda maior'],drift:['SOBREVOO','Deslize por ilhas e cardumes'],ink:['TINTA NA ÁGUA','Toque e arraste para soltar tinta'],depths:['PROFUNDEZAS','Deslize para abrir a água escura'],grass:['SENTIR A GRAMA','Passe o dedo pela grama']};let mode='sea',last=0,elapsed=0,points=[],rips=[],fish=Array.from({length:15},()=>({x:Math.random(),y:Math.random(),a:Math.random()*7,s:.012+Math.random()*.01}));function fit(){let d=Math.min(devicePixelRatio||1,1.25),w=innerWidth*d,h=innerHeight*d;if(c.width!==w||c.height!==h){c.width=w;c.height=h}}addEventListener('resize',fit);fit();function p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,t:0}}function touch(e){let q=p(e);points.push(q);if(mode==='sea'||mode==='waves')rips.push({...q,r:0});if(mode==='ink')for(let i=0;i<11;i++)rips.push({...q,r:0,a:Math.random()*6.28,ink:1});if(points.length>90)points.shift()}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);touch(e)};c.onpointermove=e=>{if(e.buttons)touch(e)};function ripple(x,y,r,a){ctx.strokeStyle=`rgba(235,246,229,${a})`;ctx.lineWidth=Math.max(1,c.width*.002);ctx.beginPath();ctx.ellipse(x*c.width,y*c.height,r*c.width,r*c.width*.36,0,0,7);ctx.stroke()}function water(t){let g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#0b4550');g.addColorStop(1,'#041922');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<25;i++){let y=(i/24)*c.height,off=Math.sin(t*.00025+i)*18;ctx.strokeStyle=`rgba(125,205,192,${.05+(i%3)*.02})`;ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(c.width*.3,y+off,c.width*.65,y-off,c.width,y);ctx.stroke()}for(let i=0;i<5;i++){let x=(.1+i*.2)*c.width,y=(.25+(i%2)*.25)*c.height;ctx.fillStyle='#293d3a';ctx.beginPath();ctx.ellipse(x,y,c.width*.1,c.width*.06,.4,0,7);ctx.fill()}}function draw(t){fit();let w=c.width,h=c.height;ctx.clearRect(0,0,w,h);if(mode==='sea'||mode==='waves'){water(t);for(let r of rips){r.r+=.0018;r.t+=.018;ripple(r.x,r.y,r.r,Math.max(0,.5-r.r*1.7))}}else if(mode==='drift'){water(t);let y=(t*.000013)%1;for(let i=0;i<7;i++){let x=((i*.29+y*.18)%1)*w,yy=((i*.17+y)%1)*h;ctx.fillStyle='#4e6951';ctx.beginPath();ctx.ellipse(x,yy,w*.11,w*.07,.3,0,7);ctx.fill();ctx.fillStyle='#d3b46c';ctx.beginPath();ctx.ellipse(x-w*.01,yy-h*.01,w*.035,w*.018,0,0,7);ctx.fill()}}else if(mode==='ink'){let g=ctx.createRadialGradient(w*.5,h*.45,0,w*.5,h*.5,w*.8);g.addColorStop(0,'#174d50');g.addColorStop(1,'#061c26');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let r of rips){r.r+=.0012;r.t+=.014;let x=(r.x+Math.cos(r.a||0)*r.r)*w,y=(r.y+Math.sin(r.a||0)*r.r)*h,rad=w*(.025+r.r*1.8);let q=ctx.createRadialGradient(x,y,0,x,y,rad);q.addColorStop(0,`rgba(107,205,167,${Math.max(0,.65-r.r*2)})`);q.addColorStop(1,'rgba(80,175,155,0)');ctx.fillStyle=q;ctx.fillRect(x-rad,y-rad,rad*2,rad*2)}}else if(mode==='depths'){let g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#527f78');g.addColorStop(1,'#133946');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let f of fish){f.x=(f.x+Math.cos(f.a)*f.s*.025+1)%1;f.y=(f.y+Math.sin(f.a)*f.s*.025+1)%1;ctx.fillStyle='#d8b859';ctx.save();ctx.translate(f.x*w,f.y*h);ctx.rotate(f.a);ctx.beginPath();ctx.ellipse(0,0,w*.025,w*.008,0,0,7);ctx.fill();ctx.restore()}ctx.fillStyle='#031820e8';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='destination-out';for(let q of points){q.t+=.008;let r=w*.07,g=ctx.createRadialGradient(q.x*w,q.y*h,0,q.x*w,q.y*h,r);g.addColorStop(0,`rgba(0,0,0,${Math.max(0,.95-q.t*.06)})`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(q.x*w-r,q.y*h-r,r*2,r*2)}ctx.globalCompositeOperation='source-over'}else{let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#7fa9b1');g.addColorStop(.55,'#739b6c');g.addColorStop(.56,'#31533c');g.addColorStop(1,'#102b23');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<140;i++){let x=(i*37%w),len=h*(.13+(i%7)*.018),bend=Math.sin(t*.001+i)*8;ctx.strokeStyle=`hsl(${104+i%30} 35% ${22+i%20}%)`;ctx.lineWidth=2+(i%3);ctx.beginPath();ctx.moveTo(x,h);ctx.quadraticCurveTo(x+bend,h-len*.5,x+bend*1.3,h-len);ctx.stroke()}}rips=rips.filter(r=>r.r<.55);points=points.filter(q=>q.t<18);requestAnimationFrame(draw)}requestAnimationFrame(draw);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));title.textContent=labels[mode][0];hint.textContent=labels[mode][1];points=[];rips=[]});setInterval(()=>{elapsed=Math.min(600,elapsed+1);let left=600-elapsed;timer.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;bar.style.width=`${left/6}%`},1000)})();
</script></body></html>
